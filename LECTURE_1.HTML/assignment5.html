<!DOCTYPE html>
<html>
<head>
    <title>Minimal To-Do List</title>
    <style>
        body { font-family: sans-serif; }
        ul { list-style: none; padding: 0; }
        li { display: flex; justify-content: space-between; padding: 5px 0; }
        .completed { text-decoration: line-through; color: grey; }
        button { margin-left: 10px; }
    </style>
</head>
<body>

    <center><h1>To-Do List</h1></center>
    <input id="taskInput" placeholder="Add a new task...">
    <button id="addBtn">Add</button>
    <ul id="taskList"></ul>

    <script>
        const taskInput = document.getElementById('taskInput');
        const addBtn = document.getElementById('addBtn');
        const taskList = document.getElementById('taskList');

        const addTask = () => {
            const taskText = taskInput.value.trim();
            if (taskText === "") return;
            
            const li = document.createElement('li');
            li.innerHTML = `<span>${taskText}</span><button class="delete">Delete</button>`;
            taskList.appendChild(li);
            
            taskInput.value = "";
            taskInput.focus();
        };

        addBtn.addEventListener('click', addTask);
        taskInput.addEventListener('keypress', (e) => e.key === 'Enter' && addTask());

        taskList.addEventListener('click', (e) => {
            if (e.target.tagName === 'SPAN') {
                e.target.parentElement.classList.toggle('completed');
            }
            if (e.target.classList.contains('delete')) {
                e.target.parentElement.remove();
            }
        });
    </script>

</body>
</html>
